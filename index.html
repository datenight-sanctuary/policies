<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Date Night Sanctuary — Policies</title>
  <style>
    :root {
      --bg: #1a1025;
      --card: #241535;
      --border: #3d2060;
      --lavender: #c084fc;
      --lavender-dim: #a855f7;
      --text: #e2d9f3;
      --muted: #9d8ec0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .wrap { max-width: 480px; width: 100%; text-align: center; }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--lavender);
      margin-bottom: 8px;
    }
    .tagline {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 40px;
      line-height: 1.5;
    }
    .cards { display: flex; flex-direction: column; gap: 16px; }
    a.card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 24px;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.2s, transform 0.15s;
    }
    a.card:hover {
      border-color: var(--lavender-dim);
      transform: translateY(-2px);
    }
    .card-icon { font-size: 28px; flex-shrink: 0; }
    .card-text { text-align: left; }
    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--lavender);
      margin-bottom: 3px;
    }
    .card-desc { font-size: 0.85rem; color: var(--muted); line-height: 1.4; }
    .arrow {
      margin-left: auto;
      color: var(--border);
      font-size: 1rem;
      flex-shrink: 0;
    }
    footer {
      margin-top: 40px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon">💜</div>
    <h1>Date Night Sanctuary</h1>
    <p class="tagline">Legal policies for the Date Night Sanctuary app,<br>available on iOS and Android.</p>

    <div class="cards">
      <a class="card" href="privacy.html">
        <div class="card-icon">🔒</div>
        <div class="card-text">
          <div class="card-title">Privacy Policy</div>
          <div class="card-desc">How the app handles your data and what stays on your device.</div>
        </div>
        <div class="arrow">›</div>
      </a>
      <a class="card" href="terms.html">
        <div class="card-icon">📄</div>
        <div class="card-text">
          <div class="card-title">Terms of Service</div>
          <div class="card-desc">Terms and conditions for using Date Night Sanctuary.</div>
        </div>
        <div class="arrow">›</div>
      </a>
    </div>

    <footer>
      <p>Questions? <a href="mailto:shanguaih@gmail.com">shanguaih@gmail.com</a></p>
    </footer>
  </div>
</body>
</html>
